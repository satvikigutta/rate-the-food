{% extends "base.html" %}
{% block title %}Log in | Rate the Food{% endblock %}
{% block content %}
<h1>Log in</h1>
<form class="auth-form" method="post">
  <label for="username">Username
    <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required>
  </label>
  <label for="password">Password
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Log in</button>
</form>
<p class="auth-alternative">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
