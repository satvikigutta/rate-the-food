<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rate the Food{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202820;
      background: #f7f8f4;
    }

    body {
      margin: 0;
      min-width: 320px;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e2e7df;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 960px;
      min-height: 64px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .brand {
      color: #245a3d;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
    }

    nav a,
    nav button {
      color: #435448;
      font-size: 0.95rem;
      text-decoration: none;
    }

    nav form {
      margin: 0;
    }

    nav button {
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      cursor: pointer;
    }

    main {
      max-width: 912px;
      min-height: 60vh;
      margin: 0 auto;
      padding: 56px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.1;
    }

    p {
      max-width: 600px;
      color: #58645a;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .flash {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-left: 3px solid #245a3d;
      background: #eaf1e9;
      color: #243c2d;
    }

    .flash.error {
      border-color: #a33a32;
      background: #f8e9e7;
      color: #70251f;
    }

    .auth-form {
      display: grid;
      gap: 16px;
      max-width: 400px;
      margin-top: 28px;
    }

    .auth-form label {
      display: grid;
      gap: 6px;
      color: #435448;
      font-size: 0.95rem;
    }

    .auth-form input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #bdc8bc;
      border-radius: 4px;
      background: #fff;
      color: #202820;
      font: inherit;
    }

    .auth-form button {
      justify-self: start;
      padding: 10px 16px;
      border: 0;
      border-radius: 4px;
      background: #245a3d;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .auth-alternative {
      margin-top: 20px;
      font-size: 0.95rem;
    }

    .auth-alternative a {
      color: #245a3d;
    }

    .place-list {
      margin: 32px 0 0;
      padding: 0;
      border-top: 1px solid #dce3da;
      list-style: none;
    }

    .place-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid #dce3da;
    }

    .place-rank,
    .place-meta,
    .review-meta {
      color: #667267;
      font-size: 0.9rem;
    }

    .place-name {
      color: #245a3d;
      font-size: 1.1rem;
      font-weight: 650;
      text-decoration: none;
    }

    .place-meta {
      margin: 5px 0 0;
    }

    .place-rating {
      min-width: 106px;
      text-align: right;
      font-weight: 650;
    }

    .place-rating small {
      display: block;
      margin-top: 4px;
      color: #667267;
      font-size: 0.8rem;
      font-weight: 400;
    }

    .place-description {
      margin: 18px 0 0;
    }

    .reviews {
      margin-top: 36px;
    }

    .review {
      padding: 18px 0;
      border-top: 1px solid #dce3da;
    }

    .review-heading {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: baseline;
      margin: 0;
    }

    .review-text {
      margin: 10px 0 0;
    }

    .review-form-section {
      margin-top: 36px;
    }

    .review-form {
      display: grid;
      gap: 14px;
      max-width: 600px;
      margin-top: 18px;
    }

    .review-form label {
      display: grid;
      gap: 6px;
      color: #435448;
      font-size: 0.95rem;
    }

    .review-form select,
    .review-form textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #bdc8bc;
      border-radius: 4px;
      background: #fff;
      color: #202820;
      font: inherit;
    }

    .review-form textarea {
      resize: vertical;
    }

    .review-form button {
      justify-self: start;
      padding: 10px 16px;
      border: 0;
      border-radius: 4px;
      background: #245a3d;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .review-limit {
      margin: -8px 0 0;
      font-size: 0.85rem;
    }

    @media (max-width: 520px) {
      .place-row {
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 10px;
      }

      .place-rating {
        grid-column: 2;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="brand" href="{{ url_for('home') }}">Rate the Food</a>
      <a href="{{ url_for('home') }}">Home</a>
      {% if session.get('user_id') %}
        <span>Hi, {{ session.get('username') }}</span>
        <form action="{{ url_for('logout') }}" method="post">
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}" role="{% if category == 'error' %}alert{% else %}status{% endif %}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
