<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rate the Food{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202820;
      background: #f7f8f4;
    }

    body {
      margin: 0;
      min-width: 320px;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e2e7df;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 960px;
      min-height: 64px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .brand {
      color: #245a3d;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
    }

    nav a:last-child {
      color: #435448;
      font-size: 0.95rem;
      text-decoration: none;
    }

    main {
      max-width: 912px;
      min-height: 60vh;
      margin: 0 auto;
      padding: 56px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.1;
    }

    p {
      max-width: 600px;
      color: #58645a;
      font-size: 1.05rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="brand" href="{{ url_for('home') }}">Rate the Food</a>
      <a href="{{ url_for('home') }}">Home</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
